# Один бюджет и один val для всех шести кандидатов. Это короткий учебный поиск.
model:
  name: Qwen/Qwen3-1.7B
  revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  device: auto
  dtype: bfloat16
  enable_thinking: false
data:
  train: ../hw4/data/tokenized/train.pt
  val: ../hw4/data/tokenized/val.pt
train:
  seed: 42
  max_steps: 4
  train_limit: 32
  val_limit: 8
  batch_size: 1
  grad_accum: 2
  eval_every: 2
  gradient_checkpointing: true
lora:
  dropout: 0.05
  alpha_over_r: 2
sweep:
  - {name: qv-r4-low, r: 4, lr: 0.0001, target_modules: [q_proj, v_proj]}
  - {name: qv-r4-high, r: 4, lr: 0.0003, target_modules: [q_proj, v_proj]}
  - {name: qv-r8-low, r: 8, lr: 0.0001, target_modules: [q_proj, v_proj]}
  - {name: qv-r8-high, r: 8, lr: 0.0003, target_modules: [q_proj, v_proj]}
  - {name: all-r8-low, r: 8, lr: 0.0001, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  - {name: all-r8-high, r: 8, lr: 0.0003, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
tracking:
  uri: http://127.0.0.1:5006
  experiment: hw6-lora
registry:
  name: arxiv-title-qwen3-1-7b
  alias: champion
  # Порог относительный к базе на ТОМ ЖЕ val; меньше loss — лучше.
  max_val_ratio: 1.0
generation:
  max_new_tokens: 40
  system: "Given the abstract of an arXiv paper, produce a concise, informative title. Output only the title, with no quotes or explanations."
  prompts:
    - "An approach for engineering student exercises using the Internet is described. In this approach, each student receives the same problem, but with different data. The implementation provides immediate feedback and records results for the instructor."
    - "We study noisy low-rank matrix completion under a general sampling distribution. We propose nuclear-norm penalized estimators with minimax-optimal error bounds."
