global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: hw11
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [hw11]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: hw11-api|hw11-observer
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics|http
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
  - job_name: kubelet
    scheme: https
    metrics_path: /api/v1/nodes/mlops-hw11-control-plane/proxy/metrics/cadvisor
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    static_configs:
      - targets: [kubernetes.default.svc:443]
