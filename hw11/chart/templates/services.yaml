apiVersion: v1
kind: Service
metadata:
  name: hw11-plain
spec:
  selector: {app: hw11-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: hw11-affinity
spec:
  selector: {app: hw11-api}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: {timeoutSeconds: 10800}
  ports: [{name: http, port: 8000, targetPort: http}]
