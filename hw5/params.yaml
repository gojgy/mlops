# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-1.7B"
  device: "auto"            # auto | cpu | cuda | mps
  dtype: "bfloat16"
  mps_high_watermark: 0.7
  mps_low_watermark: 0.4
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

sample:
  source_train: "../hw4/data/tokenized/train.pt"
  source_val: "../hw4/data/tokenized/val.pt"
  train_size: 512
  val_size: 128
  seed: 42

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 1
  grad_accum: 8             # эффективный батч = 8
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  eval_batch_size: 1
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 40
  prompts:
  - In the present paper, we consider the problem of matrix completion with noise. Unlike previous works,
    we consider quite general sampling distribution and we do not need to know or to estimate the variance
    of the noise. Two new nuclear-norm penalized estimators are proposed, one of them of "square-root"
    type. We analyse their performance under high-dimensional scaling and provide non-asymptotic bounds
    on the Frobenius norm error. Up to a logarithmic factor, these performance guarantees are minimax
    optimal in a number of circumstances.
  - Linear processes are defined as a discrete-time convolution between a kernel and an infinite sequence
    of i.i.d. random variables. We modify this convolution by introducing decimation, that is, by stretching
    time accordingly. We then establish central limit theorems for arrays of squares of such decimated
    processes. These theorems are used to obtain the asymptotic behavior of estimators of the spectral
    density at specific frequencies. Another application, treated elsewhere, concerns the estimation of
    the long-memory parameter in time-series, using wavelets.
  - In this paper, we develop an approach for the exact determination of the minimum sample size for the
    estimation of a Poisson parameter with prescribed margin of error and confidence level. The exact
    computation is made possible by reducing infinite many evaluations of coverage probability to finite
    many evaluations. Such reduction is based on our discovery that the minimum of coverage probability
    with respect to a Poisson parameter bounded in an interval is attained at a discrete set of finite
    many values.
  - An approach for engineering student exercises using the Internet is described. In this approach, for
    a given exercise, each student receives the same problem, but with different data. The exercise content
    can be static or dynamic, and the dynamic form can be timeless or real-time. The implementation provides
    immediate feedback to the students, letting them know if their submitted answers are correct. Student
    results for each exercise are recorded in log files which are available to the instructor. Example
    exercises from engineering computer security and cryptography courses are presented.
  - Sufficient conditions for global stabilization of nonlinear systems with delayed input by means of
    approximate predictors are presented. An approximate predictor is a mapping which approximates the
    exact values of the stabilizing input for the corresponding system with no delay. A systematic procedure
    for the construction of approximate predictors is provided for globally Lipschitz systems. The resulting
    stabilizing feedback can be implemented by means of a dynamic distributed delay feedback law. Illustrating
    examples show the efficiency of the proposed control strategy.
  system: Given the abstract of an arXiv paper, produce a concise, informative title. Output only the
    title, with no quotes or explanations.
  references:
  - id: arxiv:1203.0108
    topic: math.ST
    title: Noisy low-rank matrix completion with general sampling distribution
  - id: arxiv:0805.0779
    topic: math.ST
    title: Central Limit Theorems for arrays of decimated linear processes
  - id: arxiv:0707.2116
    topic: math.ST
    title: Exact Computation of Minimum Sample size for Estimation of Poisson Parameters
  - id: arxiv:1208.1969
    topic: cs.CY
    title: An Internet Approach for Engineering Student Exercises
  - id: arxiv:0910.3757
    topic: math.OC
    title: Stabilization by Means of Approximate Predictors for Systems with Delayed Input

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
