            and write a title for it. Reply with the title only.
          - Given the abstract of an arXiv paper, produce a concise, informative
            title. Output only the title, with no quotes or explanations.
          - 'Task: title generation. The user message contains the abstract of a paper.
            Answer with a single line: the title the authors could have given it.'
          - You help researchers name their papers. Based on the abstract below,
            suggest one title in the style of arXiv. Do not add anything except 
            the title.
          - Write the title of the scientific paper whose abstract is provided. 
            Keep it specific to the content of the abstract and return just the 
            title.
